<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Admin Panel - Standings & Dynamic Link Generator</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root { --cyan: #00f2ff; }
        body { font-family: 'Oswald', sans-serif; background: #0b0e11; color: white; padding: 15px; margin: 0; }
        .admin-panel { background: #15191d; padding: 20px; border-radius: 12px; max-width: 1200px; margin: auto; border: 1px solid #2d3439; }
        
        .btn { flex: 1; padding: 12px; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; text-transform: uppercase; transition: 0.3s; }
        
        .trans-mode-btn { background: #2196F3; color: white; border: none; padding: 10px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .trans-mode-btn.active { background: #e91e63; color: white; }

        .color-picker-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; background: #1c2227; padding: 15px; border-radius: 8px; border: 1px solid #2d3439; margin-bottom: 20px; }
        .color-item { display: flex; flex-direction: column; gap: 4px; }
        .color-item label { font-size: 11px; color: #aaa; text-transform: uppercase; font-weight: bold; }
        .color-item input[type="color"] { width: 100%; height: 35px; border: none; border-radius: 4px; cursor: pointer; background: transparent; }

        .history-container { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; background: #1c2227; padding: 12px; border-radius: 8px; border: 1px solid #2d3439; align-items: center; }
        .hist-btn { background: #252c33; color: var(--cyan); border: 1px solid var(--cyan); padding: 8px 16px; cursor: pointer; border-radius: 4px; font-weight: bold; text-transform: uppercase; transition: 0.2s; }
        .hist-btn.active { background: var(--cyan); color: #000; }

        .overall-btn { background: linear-gradient(135deg, #00f2ff 0%, #0088ff 100%); color: #000; border: none; padding: 8px 18px; cursor: pointer; border-radius: 4px; font-weight: 800; text-transform: uppercase; transition: 0.2s; box-shadow: 0 0 10px rgba(0, 242, 255, 0.3); }
        .overall-btn:hover { transform: scale(1.03); box-shadow: 0 0 15px rgba(0, 242, 255, 0.6); }

        .obs-link-box { background: #0b0e11; border: 1px solid var(--cyan); padding: 12px; border-radius: 8px; margin-top: 15px; margin-bottom: 15px; display: flex; gap: 10px; align-items: center; }
        .obs-link-input { background: transparent; border: none; color: #00f2ff; font-size: 14px; width: 100%; font-family: monospace; }
        .copy-btn { background: var(--cyan); color: #000; border: none; padding: 8px 16px; font-weight: bold; border-radius: 4px; cursor: pointer; }

        .team-row { background: #1c2227; padding: 12px; margin-top: 10px; border-radius: 8px; border: 1px solid #2d3439; display: grid; grid-template-columns: 1.2fr 1.2fr 75px 75px 75px 75px 100px 30px; gap: 10px; align-items: center; }
        input[type="text"], input[type="number"] { background: #0b0e11; border: 1px solid #343a40; color: white; padding: 8px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .status-dot { width: 22px; height: 22px; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        .label-tag { font-size: 9px; color: #888; display: block; margin-top: 2px; text-transform: uppercase; }
    </style>
</head>
<body>
    <div id="admin-content" class="admin-panel" style="display:none;">
        <h2 style="text-align:center; color:var(--cyan); margin-top:0;">BGMI ADMIN - OVERALL & COLOR CONTROLLER</h2>
        
        <!-- COLOR CUSTOMIZER SECTION -->
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
            <div style="font-size: 12px; color: var(--cyan); font-weight: bold; text-transform: uppercase;">🎨 Custom Theme & Live Color Controller:</div>
            <button id="picker-toggle-btn" class="trans-mode-btn" style="background:#9c27b0;" onclick="toggleClickPickerMode()">SELECT COLOR VIA MOUSE CLICK: OFF</button>
        </div>
        
        <div class="color-picker-grid">
            <div class="color-item"><label>Main Accent / Total Box</label><input type="color" id="col-cyan" value="#ffcc00" onchange="updateColor('cyan', this.value)"></div>
            <div class="color-item"><label>Board Main Bg</label><input type="color" id="col-dark-blue" value="#12193b" onchange="updateColor('dark-blue', this.value)"></div>
            <div class="color-item"><label>Team Row Bg</label><input type="color" id="col-row-bg" value="#1a2245" onchange="updateColor('row-bg', this.value)"></div>
            <div class="color-item"><label>Header Row Bg</label><input type="color" id="col-top-row-bg" value="#15191d" onchange="updateColor('top-row-bg', this.value)"></div>
            <div class="color-item"><label>Alive Status Bar</label><input type="color" id="col-status-bar-color" value="#ffcc00" onchange="updateColor('status-bar-color', this.value)"></div>
            <div class="color-item"><label>Prediction Tag Bg</label><input type="color" id="col-pred-tag-bg" value="#ffb800" onchange="updateColor('pred-tag-bg', this.value)"></div>
            <div class="color-item"><label>WWCD Banner Bg</label><input type="color" id="col-elim-main-bg" value="#e63900" onchange="updateColor('elim-main-bg', this.value)"></div>
            <div class="color-item"><label>Elim Stats Bar Bg</label><input type="color" id="col-elim-stats-bg" value="#ffaa00" onchange="updateColor('elim-stats-bg', this.value)"></div>
        </div>

        <div style="font-size: 11px; color: #888; margin-top: 10px; font-weight: bold; text-transform: uppercase;">Select Active View for OBS Overlay:</div>
        <div class="history-container" id="history-buttons-layout"></div>

        <!-- GENERATED OBS BROWSER LINK BOX -->
        <div class="obs-link-box">
            <span style="font-weight:bold; color:#fff; font-size:12px; white-space:nowrap;">🎥 OBS BROWSER SOURCE LINK:</span>
            <input type="text" id="obs-link-field" class="obs-link-input" readonly value="Click any match button above to generate link...">
            <button class="copy-btn" onclick="copyObsLink()">COPY LINK</button>
        </div>

        <div style="display:flex; gap:10px; margin-bottom:20px; margin-top:15px; flex-wrap:wrap;">
            <button class="btn" style="background:#2ed573; color:white;" onclick="addTeam()">+ ADD TEAM</button>
            <button class="btn" style="background:#ffa502; color:white;" onclick="globalNewMatch()">NEW MATCH (RESET STATUS)</button>
            <button id="trans-btn" class="trans-mode-btn" onclick="toggleTransparentLayout()">LAYOUT BACKGROUND: DEFAULT</button>
            <button class="btn" style="background:#ff4757; color:white;" onclick="resetAll()">FULL RESET</button>
        </div>
        <div id="team-list"></div>
    </div>

    <script>
        const pass = prompt("Sanjay Bhai, Password daalo:");
        if(pass === "DT@97") {
            document.getElementById('admin-content').style.display = 'block';
        } else {
            document.body.innerHTML = "<h1 style='color:red; text-align:center; margin-top:50px;'>ACCESS DENIED</h1>";
            window.stop();
        }

        const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const SYNC_PATH = 'TournamentData/LiveSession';
        let teams = []; let matchHistory = {};
        let isTransparentLayout = false;
        let pickerActive = false;
        let currentActiveView = 'Overall';

        db.ref(SYNC_PATH).on('value', (snap) => {
            const data = snap.val() || {};
            teams = data.teams || []; 
            matchHistory = data.history || {};
            isTransparentLayout = !!data.transparentLayout;
            pickerActive = !!data.pickerActive;
            currentActiveView = data.activeView || 'Overall';

            const cfg = data.config || {};
            Object.keys(cfg).forEach(k => {
                const el = document.getElementById('col-' + k);
                if(el) el.value = cfg[k];
            });

            updateTransBtnUI();
            updatePickerBtnUI();
            renderHistoryButtons();
            updateObsLinkDisplay(currentActiveView);
            draw();
        });

        function updateColor(key, value) {
            db.ref(SYNC_PATH + '/config/' + key).set(value);
        }

        function toggleClickPickerMode() {
            pickerActive = !pickerActive;
            db.ref(SYNC_PATH + '/pickerActive').set(pickerActive);
        }

        function updatePickerBtnUI() {
            const btn = document.getElementById('picker-toggle-btn');
            if(btn) {
                btn.innerText = pickerActive ? "SELECT COLOR VIA MOUSE CLICK: ON (CLICK OVERLAY)" : "SELECT COLOR VIA MOUSE CLICK: OFF";
                btn.style.background = pickerActive ? "#e91e63" : "#9c27b0";
            }
        }

        function updateTransBtnUI() {
            const btn = document.getElementById('trans-btn');
            if(btn) {
                btn.innerText = isTransparentLayout ? "LAYOUT BACKGROUND: TRANSPARENT (CUSTOM GFX)" : "LAYOUT BACKGROUND: DEFAULT";
                if(isTransparentLayout) btn.classList.add('active'); else btn.classList.remove('active');
            }
        }

        function toggleTransparentLayout() {
            isTransparentLayout = !isTransparentLayout;
            db.ref(SYNC_PATH + '/transparentLayout').set(isTransparentLayout);
        }

        function selectMatchView(viewKey) {
            currentActiveView = viewKey;
            db.ref(SYNC_PATH + '/activeView').set(viewKey);
            updateObsLinkDisplay(viewKey);
        }

        function updateObsLinkDisplay(viewKey) {
            // Yahan par aapka Overlay HTML file ka Path / GitHub Pages URL auto generate ho jayega
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/overlay.html';
            const generatedUrl = `${baseUrl}?view=${viewKey}`;
            document.getElementById('obs-link-field').value = generatedUrl;
        }

        function copyObsLink() {
            const copyText = document.getElementById("obs-link-field");
            copyText.select();
            copyText.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(copyText.value);
            alert("OBS Browser Source Link Copied!\n\nPaste this URL in OBS Browser Source.");
        }

        function sync(elimData = null) { 
            teams.forEach(t => { 
                t.totalFin = (parseInt(t.prevFin) || 0) + (parseInt(t.fin) || 0); 
                t.totalPos = (parseInt(t.prevPos) || 0) + (parseInt(t.pos) || 0); 
            });
            const payload = { teams, history: matchHistory, transparentLayout: isTransparentLayout, pickerActive: pickerActive, activeView: currentActiveView };
            if(elimData) payload.lastEliminated = elimData;
            db.ref(SYNC_PATH).update(payload);
        }

        function draw() {
            const list = document.getElementById('team-list'); list.innerHTML = '';
            teams.forEach((t, i) => {
                list.innerHTML += `<div class="team-row">
                    <div><span class="label-tag">Team</span><input type="text" value="${t.name || ''}" onchange="edit(${i},'name',this.value)"></div>
                    <div><span class="label-tag">Logo</span><input type="text" value="${t.logo || ''}" onchange="edit(${i},'logo',this.value)"></div>
                    <div><span class="label-tag">Prev Kills</span><input type="number" value="${t.prevFin || 0}" onchange="edit(${i},'prevFin',this.value)"></div>
                    <div><span class="label-tag">Match Kills</span><input type="number" value="${t.fin || 0}" onchange="edit(${i},'fin',this.value)"></div>
                    <div><span class="label-tag">Prev Pos</span><input type="number" value="${t.prevPos || 0}" onchange="edit(${i},'prevPos',this.value)"></div>
                    <div><span class="label-tag">Match Pos</span><input type="number" value="${t.pos || 0}" onchange="edit(${i},'pos',this.value)"></div>
                    <div><span class="label-tag">Status</span><div style="display:flex; gap:4px;">
                        ${t.alive.map((a,pi)=>`<button class="status-dot" style="background:${a? '#ffcc00' : '#333'}" onclick="tog(${i},${pi})"></button>`).join('')}
                    </div></div>
                    <button style="color:red; background:none; border:none; cursor:pointer;" onclick="removeTeam(${i})">✖</button>
                </div>`;
            });
        }

        function edit(i,f,v) { 
            if(f === 'prevFin' || f === 'fin' || f === 'prevPos' || f === 'pos') {
                teams[i][f] = parseInt(v) || 0;
            } else {
                teams[i][f] = v;
            }
            sync(); 
        }
        
        function tog(i,pi) {
            teams[i].alive[pi] = teams[i].alive[pi] ? 0 : 1;
            let elim = null;
            if (teams[i].alive.every(a => a == 0)) {
                if (!teams[i].elim) {
                    teams[i].elim = true;
                    let aliveCount = teams.filter(t => !t.elim).length;
                    let rankNum = aliveCount + 1;
                    elim = { 
                        id: Date.now().toString(), 
                        name: teams[i].name, 
                        logo: teams[i].logo, 
                        finishes: (parseInt(teams[i].fin)||0),
                        rank: rankNum
                    };
                }
            } else {
                teams[i].elim = false;
            }
            sync(elim);
        }

        function addTeam() { teams.push({ name: "TEAM", logo: "", fin: 0, prevFin: 0, totalFin: 0, pos: 0, prevPos: 0, totalPos: 0, alive: [1,1,1,1], elim: false }); sync(); }
        
        function renderHistoryButtons() {
            const container = document.getElementById('history-buttons-layout');
            container.innerHTML = '';

            const overallBtn = document.createElement('button');
            overallBtn.className = 'overall-btn';
            overallBtn.innerText = '📊 OVERALL STANDINGS';
            overallBtn.onclick = () => selectMatchView('Overall');
            container.appendChild(overallBtn);

            const keys = Object.keys(matchHistory);
            if(keys.length === 0) {
                container.innerHTML += `<span style="color:#888; font-size:12px; margin-left: 10px;">(No past matches archived yet)</span>`;
                return;
            }

            keys.sort((a,b) => parseInt(a.replace("Match", "")) - parseInt(b.replace("Match", "")))
                .forEach(key => {
                    const btn = document.createElement('button');
                    btn.className = 'hist-btn' + (currentActiveView === key ? ' active' : '');
                    btn.innerText = key.replace("Match", "MATCH ");
                    btn.onclick = () => selectMatchView(key);
                    container.appendChild(btn);
                });
        }

        function globalNewMatch() { 
            if(confirm("New Match? Status reset hoga, points history me save ho jayenge.")) {
                const currentMatchNumber = Object.keys(matchHistory).length + 1;
                const matchKeyName = "Match" + currentMatchNumber;
                
                matchHistory[matchKeyName] = JSON.parse(JSON.stringify(teams));

                teams.forEach(t => { 
                    t.prevFin = (parseInt(t.prevFin) || 0) + (parseInt(t.fin) || 0); 
                    t.fin = 0; 
                    t.prevPos = (parseInt(t.prevPos) || 0) + (parseInt(t.pos) || 0);
                    t.pos = 0;
                    t.alive = [1,1,1,1]; t.elim = false; 
                }); 
                
                db.ref(SYNC_PATH + '/lastEliminated').remove().then(() => sync());
            }
        }
        
        function removeTeam(i) { if(confirm("Delete Team?")) { teams.splice(i, 1); sync(); } }
        function resetAll() { if(confirm("HARD RESET? History aur teams sab clean ho jayega.")) { db.ref(SYNC_PATH).set(null); } }
    </script>
</body>
</html>
