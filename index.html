<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BGMI Esports Admin Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #0284c7;
            --accent-red: #ef4444;
            --accent-green: #22c55e;
            --text: #f8fafc;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: var(--bg-color); color: var(--text); padding: 20px; }

        .container { max-width: 1400px; margin: 0 auto; }
        h1 { margin-bottom: 20px; text-align: center; color: #38bdf8; text-transform: uppercase; }

        .control-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }

        h2 { font-size: 18px; margin-bottom: 15px; border-bottom: 2px solid #334155; padding-bottom: 8px; color: #f1f5f9; }

        /* RESULT CONTROL BAR */
        .result-bar { display: flex; gap: 15px; margin-bottom: 20px; align-items: center; background: #0284c715; padding: 15px; border: 1px solid var(--accent-blue); border-radius: 8px; }
        .btn { padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.2s ease; }
        .btn-green { background: var(--accent-green); color: #000; }
        .btn-red { background: var(--accent-red); color: #fff; }
        .btn-blue { background: var(--accent-blue); color: #fff; }

        select, input { padding: 8px 12px; background: #0f172a; border: 1px solid #334155; color: #fff; border-radius: 4px; font-size: 14px; width: 100%; }
        
        .team-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .team-table th, .team-table td { padding: 10px; text-align: left; border-bottom: 1px solid #334155; }
        .team-table th { background: #0f172a; color: #94a3b8; }

        .team-table input[type="number"] { width: 65px; text-align: center; }

        .status-badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .status-live { background: var(--accent-green); color: #000; }
        .status-close { background: var(--accent-red); color: #fff; }
    </style>
</head>
<body>

<div class="container">
    <h1>Tournament Live Admin Control Panel</h1>

    <!-- TOP GLOBAL SCREEN DISPLAY CONTROL -->
    <div class="card result-bar">
        <div style="flex: 1;">
            <label style="font-size: 12px; color: #94a3b8;">ACTIVE MATCH DATA SELECTOR</label>
            <select id="matchSelector" onchange="changeActiveMatch()">
                <option value="match1">Match 1 Rankings</option>
                <option value="match2">Match 2 Rankings</option>
                <option value="match3">Match 3 Rankings</option>
                <option value="overall">Overall Rankings</option>
            </select>
        </div>

        <div style="flex: 1; text-align: center;">
            <span style="font-size: 12px; color: #94a3b8;">VIEW PANEL DISPLAY STATUS</span><br>
            <span id="displayStatus" class="status-badge status-close">IN-GAME OVERLAY ACTIVE</span>
        </div>

        <div style="display: flex; gap: 10px;">
            <button id="btnShowResult" class="btn btn-green" onclick="toggleResultDisplay(true)">SHOW MATCH RANKINGS</button>
            <button id="btnCloseResult" class="btn btn-red" onclick="toggleResultDisplay(false)">RESULT CLOSE</button>
        </div>
    </div>

    <div class="control-grid">
        <!-- BRANDING & SOCIAL CONFIG -->
        <div class="card">
            <h2>Branding & Social Settings</h2>
            <div style="display: flex; flex-direction: column; gap: 12px;">
                <div>
                    <label style="font-size: 12px;">Presented By Text</label>
                    <input type="text" id="cfgPresented" value="DIVINE OMEN PRESENTS">
                </div>
                <div>
                    <label style="font-size: 12px;">Instagram Handle</label>
                    <input type="text" id="cfgIg" value="DIVINE_OMEN">
                </div>
                <div>
                    <label style="font-size: 12px;">YouTube Handle</label>
                    <input type="text" id="cfgYt" value="GODS OMEN">
                </div>
                <div>
                    <label style="font-size: 12px;">Organizer Name</label>
                    <input type="text" id="cfgOrgName" value="DIVINE OMEN">
                </div>
                <div>
                    <label style="font-size: 12px;">Tournament Logo URL</label>
                    <input type="text" id="cfgTourneyLogo" placeholder="https://...">
                </div>
                <div>
                    <label style="font-size: 12px;">Organizer/Sub Logo URL</label>
                    <input type="text" id="cfgOrgLogo" placeholder="https://...">
                </div>
                <button class="btn btn-blue" onclick="saveConfig()">Save Branding</button>
            </div>
        </div>

        <!-- TEAMS SCORES & DATA MANAGER -->
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <h2>Teams Leaderboard Points</h2>
                <button class="btn btn-green" onclick="saveTeamScores()">SAVE ALL POINTS</button>
            </div>
            
            <table class="team-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Team Name</th>
                        <th>Place Pts</th>
                        <th>Kill Pts</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody id="teamsTbody">
                    <!-- Dynamic Teams Inputs -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const SYNC_PATH = 'TournamentData/LiveSession';

    let currentMatchKey = 'match1';
    let localTeams = [];

    // Init Page & Sync Listener
    db.ref(SYNC_PATH).on('value', (snap) => {
        const data = snap.val();
        if(!data) return;

        // Display Status Update
        const statusBadge = document.getElementById('displayStatus');
        if(data.showResult === true) {
            statusBadge.innerText = "MATCH RANKINGS FULLSCREEN ON";
            statusBadge.className = "status-badge status-live";
        } else {
            statusBadge.innerText = "IN-GAME OVERLAY ACTIVE";
            statusBadge.className = "status-badge status-close";
        }

        // Selected Match Sync
        if(data.selectedMatch) {
            currentMatchKey = data.selectedMatch;
            document.getElementById('matchSelector').value = currentMatchKey;
        }

        // Load Config Values
        const cfg = data.config || {};
        if(cfg.presentedBy) document.getElementById('cfgPresented').value = cfg.presentedBy;
        if(cfg.igHandle) document.getElementById('cfgIg').value = cfg.igHandle;
        if(cfg.ytHandle) document.getElementById('cfgYt').value = cfg.ytHandle;
        if(cfg.organizerName) document.getElementById('cfgOrgName').value = cfg.organizerName;
        if(cfg.tournamentLogo) document.getElementById('cfgTourneyLogo').value = cfg.tournamentLogo;
        if(cfg.organizerLogo) document.getElementById('cfgOrgLogo').value = cfg.organizerLogo;

        // Load Teams Data for Selected Match
        if(data.matches && data.matches[currentMatchKey]) {
            localTeams = data.matches[currentMatchKey].teams || [];
        } else {
            localTeams = data.teams || [];
        }

        renderTeamsForm();
    });

    // RENDER 18 TEAMS FORM
    function renderTeamsForm() {
        const tbody = document.getElementById('teamsTbody');
        let html = '';

        for(let i = 0; i < 18; i++) {
            const t = localTeams[i] || { name: `TEAM ${i+1}`, pos: 0, fin: 0, logo: '' };
            const pos = parseInt(t.pos) || 0;
            const fin = parseInt(t.fin) || 0;
            const total = pos + fin;

            html += `
                <tr>
                    <td>${i+1}</td>
                    <td><input type="text" id="t_name_${i}" value="${t.name || ''}" placeholder="Team Name"></td>
                    <td><input type="number" id="t_pos_${i}" value="${pos}" oninput="calcTotal(${i})"></td>
                    <td><input type="number" id="t_fin_${i}" value="${fin}" oninput="calcTotal(${i})"></td>
                    <td id="t_total_${i}" style="font-weight: bold; color: #38bdf8;">${total}</td>
                </tr>
            `;
        }
        tbody.innerHTML = html;
    }

    function calcTotal(index) {
        const pos = parseInt(document.getElementById(`t_pos_${index}`).value) || 0;
        const fin = parseInt(document.getElementById(`t_fin_${index}`).value) || 0;
        document.getElementById(`t_total_${index}`).innerText = pos + fin;
    }

    // 1. MATCH 1 / MATCH 2 SELECTOR CHANGE
    function changeActiveMatch() {
        const matchKey = document.getElementById('matchSelector').value;
        const matchName = document.getElementById('matchSelector').options[document.getElementById('matchSelector').selectedIndex].text.toUpperCase();
        
        db.ref(SYNC_PATH).update({
            selectedMatch: matchKey,
            selectedMatchName: matchName
        });
    }

    // 2. TOGGLE FULLSCREEN MATCH RANKINGS (SHOW RESULT vs RESULT CLOSE)
    function toggleResultDisplay(show) {
        const matchKey = document.getElementById('matchSelector').value;
        const matchName = document.getElementById('matchSelector').options[document.getElementById('matchSelector').selectedIndex].text.toUpperCase();

        db.ref(SYNC_PATH).update({
            showResult: show,
            selectedMatch: matchKey,
            selectedMatchName: matchName
        });
    }

    // 3. SAVE TEAMS POINTS TO FIREBASE
    function saveTeamScores() {
        let updatedTeams = [];
        for(let i = 0; i < 18; i++) {
            updatedTeams.push({
                name: document.getElementById(`t_name_${i}`).value || `TEAM ${i+1}`,
                pos: parseInt(document.getElementById(`t_pos_${i}`).value) || 0,
                fin: parseInt(document.getElementById(`t_fin_${i}`).value) || 0,
                logo: (localTeams[i] && localTeams[i].logo) ? localTeams[i].logo : ''
            });
        }

        // Match-wise aur general teams sync
        db.ref(`${SYNC_PATH}/matches/${currentMatchKey}`).set({ teams: updatedTeams });
        db.ref(`${SYNC_PATH}/teams`).set(updatedTeams);
        alert('Points Successfully Saved!');
    }

    // 4. SAVE BRANDING DETAILS
    function saveConfig() {
        db.ref(`${SYNC_PATH}/config`).update({
            presentedBy: document.getElementById('cfgPresented').value,
            igHandle: document.getElementById('cfgIg').value,
            ytHandle: document.getElementById('cfgYt').value,
            organizerName: document.getElementById('cfgOrgName').value,
            tournamentLogo: document.getElementById('cfgTourneyLogo').value,
            organizerLogo: document.getElementById('cfgOrgLogo').value
        });
        alert('Branding Config Updated!');
    }
</script>
</body>
</html>
