<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Control Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --cyan: #00f2ff; }
        body { font-family: 'Oswald', sans-serif; background: #0b0e11; color: white; padding: 15px; margin: 0; }
        .admin-panel { background: #15191d; padding: 20px; border-radius: 12px; max-width: 1200px; margin: auto; border: 1px solid #2d3439; }
        .btn { padding: 10px 15px; border: none; cursor: pointer; font-weight: bold; border-radius: 6px; text-transform: uppercase; transition: 0.2s; }
        .history-container { display: flex; gap: 10px; margin-top: 10px; flex-wrap: wrap; background: #1c2227; padding: 12px; border-radius: 8px; border: 1px solid #2d3439; align-items: center; }
        .hist-btn { background: #252c33; color: var(--cyan); border: 1px solid var(--cyan); padding: 8px 14px; cursor: pointer; border-radius: 4px; font-weight: bold; text-transform: uppercase; font-size: 13px; }
        .hist-btn.active-match { background: #2ed573 !important; color: #000 !important; border-color: #2ed573 !important; box-shadow: 0 0 10px #2ed573; }
        .team-row { background: #1c2227; padding: 10px; margin-top: 8px; border-radius: 8px; border: 1px solid #2d3439; display: grid; grid-template-columns: 1.2fr 1.2fr 70px 70px 70px 70px 100px 30px; gap: 10px; align-items: center; }
        input[type="text"], input[type="number"] { background: #0b0e11; border: 1px solid #343a40; color: white; padding: 6px; border-radius: 4px; width: 100%; box-sizing: border-box; }
        .status-dot { width: 20px; height: 20px; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
        
        .config-modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); align-items: center; justify-content: center; }
        .config-modal-content { background: #15191d; border: 1px solid #00f2ff; padding: 25px; border-radius: 12px; width: 90%; max-width: 500px; }
    </style>
</head>
<body>
    <div id="admin-content" class="admin-panel" style="display:none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom:1px solid #2d3439; padding-bottom:10px;">
            <h2 style="color:var(--cyan); margin:0;">BGMI BROADCAST DASHBOARD</h2>
            <button class="btn" style="background:#0088ff; color:white;" onclick="openConfigModal()">⚙ EDIT BRANDING & LOGOS</button>
        </div>

        <div style="font-size: 12px; color: var(--cyan); font-weight: bold; text-transform: uppercase; margin-bottom: 5px;">Screen Display Mode Control:</div>
        <div class="history-container" id="match-buttons-container"></div>

        <div style="display:flex; gap:10px; margin-top:15px; margin-bottom:15px;">
            <button class="btn" style="background:#2ed573; color:white;" onclick="addTeam()">+ ADD TEAM</button>
            <button class="btn" style="background:#ffa502; color:white;" onclick="globalNewMatch()">SAVE & NEW MATCH RESET</button>
            <button class="btn" style="background:#ff4757; color:white;" onclick="resetAll()">FULL RESET ALL</button>
        </div>

        <div id="team-list"></div>
    </div>

    <!-- BRANDING MODAL -->
    <div id="config-modal" class="config-modal">
        <div class="config-modal-content">
            <h3 style="color:var(--cyan); margin-top:0; text-align:center;">🏆 TOURNAMENT BRANDING SETUP</h3>
            <div style="display:flex; flex-direction:column; gap:10px;">
                <input type="text" id="cfg-presentedBy" placeholder="Presented By (e.g. DIVINE OMEN)">
                <input type="text" id="cfg-instaHandle" placeholder="Instagram Handle (e.g. @DIVINE_OMEN)">
                <input type="text" id="cfg-ytHandle" placeholder="YouTube Channel (e.g. GODS OMEN)">
                <input type="text" id="cfg-tourneyLogo" placeholder="Event Main Logo Image URL">
                <input type="text" id="cfg-orgLogo" placeholder="Organizer Logo Image URL">
                <button class="btn" style="background:#2ed573; color:white; margin-top:10px;" onclick="saveTournamentConfig()">SAVE BRANDING</button>
            </div>
        </div>
    </div>

    <script>
        const pass = prompt("Sanjay Bhai, Password:");
        if(pass === "DT@97") {
            document.getElementById('admin-content').style.display = 'block';
        } else {
            document.body.innerHTML = "<h1 style='color:red; text-align:center;'>ACCESS DENIED</h1>";
            window.stop();
        }

        const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const SYNC_PATH = 'TournamentData/LiveSession';

        let teams = []; let matchHistory = {}; let activeMatch = 'LIVE'; let info = {};

        db.ref(SYNC_PATH).on('value', (snap) => {
            const data = snap.val() || {};
            teams = data.teams || [];
            matchHistory = data.history || {};
            activeMatch = data.activeMatch || 'LIVE';
            info = data.info || {};

            document.getElementById('cfg-presentedBy').value = info.presentedBy || '';
            document.getElementById('cfg-instaHandle').value = info.instaHandle || '';
            document.getElementById('cfg-ytHandle').value = info.ytHandle || '';
            document.getElementById('cfg-tourneyLogo').value = info.tourneyLogo || '';
            document.getElementById('cfg-orgLogo').value = info.orgLogo || '';

            renderMatchButtons();
            draw();
        });

        function setActiveMatch(matchKey) {
            activeMatch = matchKey;
            db.ref(SYNC_PATH + '/activeMatch').set(matchKey);
        }

        function renderMatchButtons() {
            const container = document.getElementById('match-buttons-container');
            container.innerHTML = '';

            // Live Game Floating Leaderboard Button
            const liveBtn = document.createElement('button');
            liveBtn.className = `hist-btn ${activeMatch === 'LIVE' ? 'active-match' : ''}`;
            liveBtn.innerText = '🔴 LIVE OVERLAY';
            liveBtn.onclick = () => setActiveMatch('LIVE');
            container.appendChild(liveBtn);

            // Match 1, Match 2, Match 3 Buttons
            Object.keys(matchHistory).sort((a,b)=>parseInt(a.replace('Match','')) - parseInt(b.replace('Match',''))).forEach(mKey => {
                const mBtn = document.createElement('button');
                mBtn.className = `hist-btn ${activeMatch === mKey ? 'active-match' : ''}`;
                mBtn.innerText = mKey.replace('Match', 'MATCH ');
                mBtn.onclick = () => setActiveMatch(mKey);
                container.appendChild(mBtn);
            });

            // Overall Full Screen Graphic Button
            const overallBtn = document.createElement('button');
            overallBtn.className = `hist-btn ${activeMatch === 'OVERALL' ? 'active-match' : ''}`;
            overallBtn.style.background = '#e91e63';
            overallBtn.innerText = '📊 OVERALL STANDINGS GRAPHIC';
            overallBtn.onclick = () => setActiveMatch('OVERALL');
            container.appendChild(overallBtn);
        }

        function sync() {
            db.ref(SYNC_PATH).update({ teams, history: matchHistory, activeMatch, info });
        }

        function draw() {
            const list = document.getElementById('team-list'); list.innerHTML = '';
            teams.forEach((t, i) => {
                list.innerHTML += `<div class="team-row">
                    <div><input type="text" value="${t.name||''}" onchange="edit(${i},'name',this.value)"></div>
                    <div><input type="text" value="${t.logo||''}" onchange="edit(${i},'logo',this.value)"></div>
                    <div><input type="number" value="${t.prevFin||0}" onchange="edit(${i},'prevFin',this.value)"></div>
                    <div><input type="number" value="${t.fin||0}" onchange="edit(${i},'fin',this.value)"></div>
                    <div><input type="number" value="${t.prevPos||0}" onchange="edit(${i},'prevPos',this.value)"></div>
                    <div><input type="number" value="${t.pos||0}" onchange="edit(${i},'pos',this.value)"></div>
                    <div style="display:flex; gap:3px;">
                        ${t.alive.map((a,pi)=>`<button class="status-dot" style="background:${a?'#ffcc00':'#333'}" onclick="tog(${i},${pi})"></button>`).join('')}
                    </div>
                    <button style="color:red; background:none; border:none; cursor:pointer;" onclick="removeTeam(${i})">✖</button>
                </div>`;
            });
        }

        function edit(i,f,v) { teams[i][f] = (f==='name'||f==='logo') ? v : (parseInt(v)||0); sync(); }
        function tog(i,pi) { teams[i].alive[pi] = teams[i].alive[pi] ? 0 : 1; sync(); }
        function addTeam() { teams.push({ name: "TEAM", logo: "", fin: 0, prevFin: 0, pos: 0, prevPos: 0, alive: [1,1,1,1] }); sync(); }

        function globalNewMatch() {
            if(confirm("Match points archive aur clean kare?")) {
                const mKey = "Match" + (Object.keys(matchHistory).length + 1);
                matchHistory[mKey] = JSON.parse(JSON.stringify(teams));
                teams.forEach(t => {
                    t.prevFin = (parseInt(t.prevFin)||0) + (parseInt(t.fin)||0); t.fin = 0;
                    t.prevPos = (parseInt(t.prevPos)||0) + (parseInt(t.pos)||0); t.pos = 0;
                    t.alive = [1,1,1,1];
                });
                activeMatch = 'LIVE';
                sync();
            }
        }

        function openConfigModal() { document.getElementById('config-modal').style.display = 'flex'; }
        function saveTournamentConfig() {
            info = {
                presentedBy: document.getElementById('cfg-presentedBy').value,
                instaHandle: document.getElementById('cfg-instaHandle').value,
                ytHandle: document.getElementById('cfg-ytHandle').value,
                tourneyLogo: document.getElementById('cfg-tourneyLogo').value,
                orgLogo: document.getElementById('cfg-orgLogo').value
            };
            sync();
                document.getElementById('config-modal').style.display = 'none';
        }
        function resetAll() { if(confirm("Data clear kare?")) db.ref(SYNC_PATH).set(null); }
    </script>
</body>
</html>
