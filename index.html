<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Overlay - Admin Controller</title>
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Oswald', sans-serif;
        }
        body {
            background-color: #121418;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1, h2 {
            color: #ffcc00;
            text-transform: uppercase;
            margin-top: 0;
        }
        .card {
            background: #1a1d24;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #2a2f3d;
        }
        .btn {
            padding: 10px 20px;
            font-weight: bold;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s ease;
        }
        .btn-primary { background: #2196F3; color: white; }
        .btn-success { background: #4CAF50; color: white; }
        .btn-danger { background: #f44336; color: white; }
        .btn-purple { background: #e91e63; color: white; }
        .btn:hover { opacity: 0.9; transform: scale(0.98); }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }
        .team-card {
            background: #232834;
            padding: 12px;
            border-radius: 6px;
            border-left: 4px solid #ffcc00;
        }
        .form-group {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        input[type="text"], input[type="number"] {
            background: #121418;
            border: 1px solid #3a4254;
            color: white;
            padding: 6px;
            border-radius: 4px;
            width: 60%;
        }
        .player-status-group {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }
        .player-btn {
            flex: 1;
            padding: 6px;
            background: #ffcc00;
            color: black;
            font-weight: bold;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            text-align: center;
        }
        .player-btn.dead {
            background: #3a4254;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>BGMI Overlay Admin Controller</h1>

    <!-- LAYOUT TOGGLE & CONTROL SECTION -->
    <div class="card">
        <h2>Layout & Stream Settings</h2>
        <div style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center;">
            <button id="trans-btn" class="btn btn-primary" onclick="toggleTransparentLayout()">
                LAYOUT BACKGROUND: DEFAULT
            </button>
            <button class="btn btn-success" onclick="saveAllData()">
                SAVE & SYNC TO OBS
            </button>
        </div>
    </div>

    <!-- TEAMS MANAGEMENT SECTION -->
    <div class="card">
        <h2>Teams & Points Management</h2>
        <div id="teams-container" class="team-grid"></div>
    </div>
</div>

<script>
    // Firebase Setup
    const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const SYNC_PATH = 'TournamentData/LiveSession';

    let isTransparentLayout = false;
    let teamsData = [];

    // Initialize Default Teams if Database is Empty
    function createDefaultTeams() {
        let list = [];
        for (let i = 1; i <= 16; i++) {
            list.push({
                id: 'team_' + i,
                name: 'TEAM ' + i,
                logo: '',
                totalFin: 0,
                totalPos: 0,
                fin: 0,
                alive: [1, 1, 1, 1]
            });
        }
        return list;
    }

    // Realtime Sync Listener From Firebase
    db.ref(SYNC_PATH).on('value', (snap) => {
        const data = snap.val() || {};
        
        // 1. Transparent Layout State Sync
        isTransparentLayout = !!data.transparentLayout;
        updateTransparentButtonUI();

        // 2. Teams Data Sync
        if (data.teams && data.teams.length > 0) {
            teamsData = data.teams;
        } else if (teamsData.length === 0) {
            teamsData = createDefaultTeams();
        }
        renderAdminTeams();
    });

    // Update UI for Transparent Layout Button
    function updateTransparentButtonUI() {
        const btn = document.getElementById('trans-btn');
        if (btn) {
            if (isTransparentLayout) {
                btn.innerText = "LAYOUT BACKGROUND: TRANSPARENT (CUSTOM GFX)";
                btn.className = "btn btn-purple";
            } else {
                btn.innerText = "LAYOUT BACKGROUND: DEFAULT";
                btn.className = "btn btn-primary";
            }
        }
    }

    // Toggle Transparent Mode Event
    function toggleTransparentLayout() {
        isTransparentLayout = !isTransparentLayout;
        db.ref(SYNC_PATH + '/transparentLayout').set(isTransparentLayout);
    }

    // Render Teams Inputs in Admin Panel
    function renderAdminTeams() {
        const container = document.getElementById('teams-container');
        container.innerHTML = '';

        teamsData.forEach((team, tIdx) => {
            let card = document.createElement('div');
            card.className = 'team-card';

            let aliveArr = team.alive || [1, 1, 1, 1];

            card.innerHTML = `
                <div class="form-group">
                    <label>Team Name:</label>
                    <input type="text" value="${team.name || ''}" onchange="updateTeamField(${tIdx}, 'name', this.value)">
                </div>
                <div class="form-group">
                    <label>Logo URL:</label>
                    <input type="text" value="${team.logo || ''}" placeholder="https://..." onchange="updateTeamField(${tIdx}, 'logo', this.value)">
                </div>
                <div class="form-group">
                    <label>Match Finishes:</label>
                    <input type="number" value="${team.fin || 0}" onchange="updateTeamField(${tIdx}, 'fin', parseInt(this.value)||0)">
                </div>
                <div class="form-group">
                    <label>Total Finishes:</label>
                    <input type="number" value="${team.totalFin || 0}" onchange="updateTeamField(${tIdx}, 'totalFin', parseInt(this.value)||0)">
                </div>
                <div class="form-group">
                    <label>Total Place Pts:</label>
                    <input type="number" value="${team.totalPos || 0}" onchange="updateTeamField(${tIdx}, 'totalPos', parseInt(this.value)||0)">
                </div>
                <div>
                    <label>Players Alive Status:</label>
                    <div class="player-status-group">
                        <button class="player-btn ${aliveArr[0] == 1 ? '' : 'dead'}" onclick="togglePlayer(${tIdx}, 0)">P1</button>
                        <button class="player-btn ${aliveArr[1] == 1 ? '' : 'dead'}" onclick="togglePlayer(${tIdx}, 1)">P2</button>
                        <button class="player-btn ${aliveArr[2] == 1 ? '' : 'dead'}" onclick="togglePlayer(${tIdx}, 2)">P3</button>
                        <button class="player-btn ${aliveArr[3] == 1 ? '' : 'dead'}" onclick="togglePlayer(${tIdx}, 4)">P4</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        });
    }

    // Input Change Handlers
    function updateTeamField(index, field, value) {
        teamsData[index][field] = value;
    }

    // Toggle Player Alive/Dead
    function togglePlayer(teamIdx, playerIdx) {
        if (!teamsData[teamIdx].alive) {
            teamsData[teamIdx].alive = [1, 1, 1, 1];
        }
        let currentStatus = teamsData[teamIdx].alive[playerIdx];
        teamsData[teamIdx].alive[playerIdx] = (currentStatus == 1 || currentStatus == '1') ? 0 : 1;
        
        // Auto-Check for Elimination Trigger
        checkEliminationTrigger(teamsData[teamIdx]);
        
        renderAdminTeams();
    }

    // Check & Trigger Elimination Banner in Database
    function checkEliminationTrigger(team) {
        let isDead = team.alive.every(a => a == 0 || a == '0');
        if (isDead) {
            let aliveTeamsCount = teamsData.filter(t => t.alive && t.alive.some(a => a == 1 || a == '1')).length;
            let elimRank = aliveTeamsCount + 1;

            db.ref(SYNC_PATH + '/lastEliminated').set({
                id: team.id || 'team_' + Date.now(),
                name: team.name,
                logo: team.logo,
                rank: elimRank,
                finishes: team.fin || 0
            });
        }
    }

    // Save All Data to Firebase
    function saveAllData() {
        db.ref(SYNC_PATH + '/teams').set(teamsData)
            .then(() => alert("Data live sync ho gaya!"))
            .catch(err => alert("Error saving data: " + err.message));
    }
</script>

</body>
</html>
