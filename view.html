<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Broadcast Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Agency FB';
            src: local('Agency FB Bold'), local('AgencyFB-Bold'), local('Agency FB');
            font-weight: bold;
        }

        :root {
            --cyan: #00f2ff;
            --blue-main: #005bb5;
            --blue-dark: #003875;
            --dark-blue: #12193b;
            --row-bg: #1a2245;
            --text-color: #ffffff;
            --status-bg: #0b0f26;
            --status-bar-color: #00f2ff;
            --top-row-bg: #090d21;
        }

        * { box-sizing: border-box; font-family: 'Oswald', sans-serif; }
        body { margin: 0; padding: 0; background: transparent; overflow: hidden; width: 100vw; height: 100vh; }

        /* --- MODE 1: LIVE IN-GAME SIDE LEADERBOARD --- */
        .leaderboard {
            position: absolute; top: 20px; left: 20px;
            width: 420px; background: var(--dark-blue); border-radius: 8px;
            overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); opacity: 1; transition: opacity 0.3s ease-in-out;
            display: block;
        }

        .header-row {
            display: grid; grid-template-columns: 35px 45px 1fr 65px 45px 55px;
            background: var(--top-row-bg); padding: 10px 8px; font-weight: 800;
            font-size: 14px; color: var(--text-color); align-items: center; text-align: center;
        }

        .team-row {
            display: grid; grid-template-columns: 35px 45px 1fr 65px 45px 55px;
            background: var(--row-bg); margin-top: 2px; padding: 6px 8px;
            align-items: center; color: var(--text-color); font-weight: 700; font-size: 16px;
        }

        .team-row.eliminated { opacity: 0.5; filter: grayscale(1); }
        .logo-col img { width: 30px; height: 30px; object-fit: contain; }
        .name-col { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; font-size: 15px; }
        .status-col { display: flex; gap: 3px; justify-content: center; background: var(--status-bg); padding: 4px; border-radius: 4px; }
        .bar { width: 8px; height: 14px; background: var(--status-bar-color); border-radius: 2px; }
        .bar.dead { background: #333 !important; }
        .total-box { background: var(--cyan); color: #000; font-weight: 800; border-radius: 4px; padding: 2px 0; text-align: center; }

        /* --- MODE 2: FULL SCREEN MATCH RANKINGS GRAPHIC (EXACT IMAGE MATCH) --- */
        .full-screen-rankings {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #ffffff; color: #000; z-index: 9999;
        }

        /* Top Header Banner */
        .rankings-header {
            position: absolute; top: 20px; right: 0; width: 75%; height: 80px;
            background: var(--blue-main); clip-path: polygon(8% 0%, 100% 0%, 100% 100%, 0% 100%);
            display: flex; align-items: center; justify-content: flex-end; padding-right: 50px;
        }
        .rankings-header-title { color: #ffffff; font-size: 55px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

        .rankings-header-decor {
            position: absolute; top: 20px; left: 18%; width: 120px; height: 80px;
            background: var(--blue-main); transform: skewX(-25deg);
        }

        /* Left Side Branding Panel */
        .left-brand-panel {
            position: absolute; left: 0; top: 0; width: 22%; height: calc(100vh - 60px);
            display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; padding: 20px 10px;
        }
        .brand-logo-main { max-width: 80%; max-height: 220px; object-fit: contain; }
        .decor-icon { width: 60px; opacity: 0.8; }

        /* Grid Layout for 18 Teams (2 Columns x 9 Rows) */
        .rankings-grid {
            position: absolute; top: 120px; right: 20px; width: 76%; height: calc(100vh - 200px);
            display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(9, 1fr); gap: 10px 20px;
        }

        .rank-card {
            background: var(--blue-main); color: #fff; display: flex; align-items: center;
            height: 100%; border-radius: 2px; overflow: hidden; position: relative;
            clip-path: polygon(0 0, 92% 0, 100% 100%, 0 100%);
        }

        .rank-num {
            width: 50px; height: 100%; background: #111b36; display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 800; color: #fff;
        }

        .rank-logo { width: 45px; height: 100%; display: flex; align-items: center; justify-content: center; padding: 2px; }
        .rank-logo img { width: 32px; height: 32px; object-fit: contain; }

        .rank-name {
            flex: 1; font-size: 18px; font-weight: 700; text-transform: uppercase;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 8px;
        }

        .rank-stats-group { display: flex; align-items: center; padding-right: 40px; gap: 15px; }
        .stat-box { display: flex; flex-direction: column; align-items: center; }
        .stat-val { font-size: 18px; font-weight: 800; color: #fff; }
        .stat-lbl { font-size: 9px; opacity: 0.7; text-transform: uppercase; margin-top: -3px; }

        /* Bottom Footer Strip */
        .bottom-footer {
            position: absolute; bottom: 0; left: 0; width: 100vw; height: 60px;
            background: #0d88d6; color: #fff; display: flex; align-items: center; justify-content: space-between;
            padding: 0 40px; font-weight: 700; font-size: 18px; text-transform: uppercase;
        }
        .footer-item { display: flex; align-items: center; gap: 10px; }
        .footer-logo { height: 35px; object-fit: contain; }
    </style>
</head>
<body>

    <!-- MODE 1: LIVE FLOATING OVERLAY -->
    <div id="board" class="leaderboard"></div>

    <!-- MODE 2: FULL SCREEN MATCH RANKINGS SCREEN -->
    <div id="full-rankings-screen" class="full-screen-rankings">
        <div class="rankings-header-decor"></div>
        <div class="rankings-header">
            <div id="rankings-header-title" class="rankings-header-title">MATCH RANKINGS</div>
        </div>

        <div class="left-brand-panel">
            <img class="decor-icon" src="https://cdn-icons-png.flaticon.com/512/808/808431.png" alt="Icon">
            <img id="brand-event-logo" class="brand-logo-main" src="" alt="Event Logo">
            <img class="decor-icon" src="https://cdn-icons-png.flaticon.com/512/808/808431.png" alt="Icon">
        </div>

        <div id="rankings-grid" class="rankings-grid"></div>

        <div class="bottom-footer">
            <div id="footer-presented-by">ORGANIZER PRESENTS</div>
            <div class="footer-item">
                <span>Follow us on Instagram :</span>
                <span id="footer-insta" style="color:#fff; font-weight:800;">@INSTAGRAM</span>
            </div>
            <div class="footer-item">
                <span>Catch the live on YouTube :</span>
                <span id="footer-yt" style="color:#fff; font-weight:800;">YOUTUBE CHANNEL</span>
            </div>
            <div class="footer-item">
                <img id="footer-org-logo" class="footer-logo" src="" alt="">
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const BASE_PATH = 'TournamentData/LiveSession';

        db.ref(BASE_PATH).on('value', (snap) => {
            const data = snap.val() || {};
            const activeMatch = data.activeMatch || 'LIVE';
            const info = data.info || {};

            // Dynamic Branding Updates
            document.getElementById('brand-event-logo').src = info.tourneyLogo || 'https://via.placeholder.com/200?text=EVENT+LOGO';
            document.getElementById('footer-org-logo').src = info.orgLogo || 'https://via.placeholder.com/100?text=ORG';
            document.getElementById('footer-presented-by').innerText = info.presentedBy ? `${info.presentedBy} PRESENTS` : 'EVENT PRESENTS';
            document.getElementById('footer-insta').innerText = info.instaHandle || '@ESPORTS';
            document.getElementById('footer-yt').innerText = info.ytHandle || 'LIVE GAMING';

            if (activeMatch === 'LIVE') {
                // Show Floating Live Leaderboard
                document.getElementById('board').style.display = 'block';
                document.getElementById('full-rankings-screen').style.display = 'none';
                renderLiveBoard(data.teams || []);
            } else {
                // Show Full Screen Graphic Overlay
                document.getElementById('board').style.display = 'none';
                document.getElementById('full-rankings-screen').style.display = 'block';

                let matchTeams = [];
                if (activeMatch === 'OVERALL') {
                    document.getElementById('rankings-header-title').innerText = 'OVERALL STANDINGS';
                    matchTeams = data.teams || [];
                } else {
                    document.getElementById('rankings-header-title').innerText = activeMatch.replace('Match', 'MATCH ') + ' RANKINGS';
                    matchTeams = (data.history && data.history[activeMatch]) ? data.history[activeMatch] : [];
                }

                renderFullScreenGrid(matchTeams, activeMatch === 'OVERALL');
            }
        });

        // 1. Live In-Game Floating Overlay Render
        function renderLiveBoard(teams) {
            const board = document.getElementById('board');
            let h = `<div class="header-row"><div style="color:var(--cyan)">#</div><div>LOGO</div><div style="text-align:left;">TEAM</div><div style="text-align:center;">STATUS</div><div>FIN.</div><div>TOTAL</div></div>`;

            const sorted = [...teams].sort((a,b) => {
                let totalA = ((parseInt(a.prevFin)||0) + (parseInt(a.fin)||0)) + ((parseInt(a.prevPos)||0) + (parseInt(a.pos)||0));
                let totalB = ((parseInt(b.prevFin)||0) + (parseInt(b.fin)||0)) + ((parseInt(b.prevPos)||0) + (parseInt(b.pos)||0));
                return totalB - totalA;
            });

            sorted.forEach((t, i) => {
                let currentKills = parseInt(t.fin) || 0;
                let overallTotal = ((parseInt(t.prevFin) || 0) + currentKills) + ((parseInt(t.prevPos) || 0) + (parseInt(t.pos) || 0));
                let logoSrc = (t.logo && t.logo.trim() !== '') ? `<img src="${t.logo}">` : '';
                let isEliminated = t.elim || (t.alive && t.alive.every(a => a == 0 || a == '0'));

                h += `<div class="team-row ${isEliminated ? 'eliminated' : ''}">
                    <div style="text-align:center;">${i+1}</div>
                    <div class="logo-col">${logoSrc}</div>
                    <div class="name-col">${t.name || 'TEAM'}</div>
                    <div class="status-col">${(t.alive || [1,1,1,1]).map(a => `<div class="bar ${a == 1 || a == '1' ? '' : 'dead'}"></div>`).join('')}</div>
                    <div style="text-align:center;">${currentKills}</div>
                    <div class="total-box">${overallTotal}</div>
                </div>`;
            });
            board.innerHTML = h;
        }

        // 2. Full Screen Image Matching Graphic Grid
        function renderFullScreenGrid(teamsList, isOverall) {
            const grid = document.getElementById('rankings-grid');
            grid.innerHTML = '';

            let sorted = [...teamsList].sort((a,b) => {
                let totalA = isOverall ? 
                    (((parseInt(a.prevFin)||0)+(parseInt(a.fin)||0)) + ((parseInt(a.prevPos)||0)+(parseInt(a.pos)||0))) :
                    ((parseInt(a.fin)||0) + (parseInt(a.pos)||0));
                let totalB = isOverall ? 
                    (((parseInt(b.prevFin)||0)+(parseInt(b.fin)||0)) + ((parseInt(b.prevPos)||0)+(parseInt(b.pos)||0))) :
                    ((parseInt(b.fin)||0) + (parseInt(b.pos)||0));
                return totalB - totalA;
            });

            // Fill up to 18 slots as per image layout
            for (let i = 0; i < 18; i++) {
                let t = sorted[i];
                if (t) {
                    let kills = isOverall ? ((parseInt(t.prevFin)||0) + (parseInt(t.fin)||0)) : (parseInt(t.fin)||0);
                    let posPts = isOverall ? ((parseInt(t.prevPos)||0) + (parseInt(t.pos)||0)) : (parseInt(t.pos)||0);
                    let totalPts = kills + posPts;
                    let logoHtml = t.logo ? `<img src="${t.logo}" onerror="this.style.display='none'">` : '';

                    grid.innerHTML += `
                        <div class="rank-card">
                            <div class="rank-num">${i + 1}</div>
                            <div class="rank-logo">${logoHtml}</div>
                            <div class="rank-name">${t.name || 'TEAM'}</div>
                            <div class="rank-stats-group">
                                <div class="stat-box"><span class="stat-val">${posPts}</span><span class="stat-lbl">PLACE PTS</span></div>
                                <div class="stat-box"><span class="stat-val">${kills}</span><span class="stat-lbl">KILLS</span></div>
                                <div class="stat-box"><span class="stat-val" style="color:var(--cyan);">${totalPts}</span><span class="stat-lbl">TOTAL</span></div>
                            </div>
                        </div>
                    `;
                } else {
                    // Empty Card Shell
                    grid.innerHTML += `
                        <div class="rank-card" style="opacity: 0.3;">
                            <div class="rank-num">${i + 1}</div>
                            <div class="rank-name">--</div>
                        </div>
                    `;
                }
            }
        }
    </script>
</body>
</html>
