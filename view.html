<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BGMI Match Rankings - Live OBS Overlay</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Agency FB';
            src: local('Agency FB Bold'), local('AgencyFB-Bold'), local('Agency FB');
            font-weight: bold;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Oswald', sans-serif; text-transform: uppercase; }

        body {
            width: 1920px;
            height: 1080px;
            background: #ffffff;
            overflow: hidden;
            position: relative;
        }

        /* TOP HEADER BANNER */
        .header-banner {
            position: absolute;
            top: 25px;
            right: 0;
            width: 1470px;
            height: 110px;
            background: #0d6efd;
            clip-path: polygon(70px 0%, 100% 0, 100% 100%, 0% 100%);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 50px;
        }

        .header-accent-1 {
            position: absolute;
            top: 25px;
            left: 420px;
            width: 180px;
            height: 110px;
            background: #0b4ebd;
            transform: skewX(-32deg);
        }

        .header-accent-2 {
            position: absolute;
            top: 25px;
            left: 630px;
            width: 200px;
            height: 110px;
            background: #0d6efd;
            transform: skewX(-32deg);
        }

        .header-title {
            font-size: 82px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: 2px;
            font-family: 'Agency FB', 'Oswald', sans-serif;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.3);
        }

        /* LEFT SIDEBAR BRANDING */
        .left-sidebar {
            position: absolute;
            left: 0;
            top: 0;
            width: 420px;
            height: 980px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 20px 10px;
        }

        .bgmi-top-logo {
            width: 240px;
            opacity: 0.15;
        }

        .tourney-main-logo {
            width: 320px;
            max-height: 380px;
            object-fit: contain;
            filter: drop-shadow(0px 10px 15px rgba(0,0,0,0.4));
        }

        .pan-icon {
            width: 85px;
            filter: drop-shadow(0px 5px 5px rgba(0,0,0,0.3));
        }

        /* RANKINGS MAIN BOARD GRID */
        .board-container {
            position: absolute;
            top: 195px;
            left: 425px;
            width: 1450px;
            height: 760px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            column-gap: 25px;
            row-gap: 12px;
        }

        .row-headers {
            position: absolute;
            top: -24px;
            width: 100%;
            display: grid;
            grid-template-columns: 80px 1fr 110px 110px 130px;
            font-size: 13px;
            font-weight: 800;
            color: #aaa;
            padding: 0 15px;
            letter-spacing: 1px;
        }

        .rank-card {
            height: 68px;
            background: #0d6efd;
            display: grid;
            grid-template-columns: 75px 1fr 100px 100px 120px;
            align-items: center;
            clip-path: polygon(0 0, 94% 0, 100% 100%, 0 100%);
            padding-right: 10px;
            color: #ffffff;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .rank-card:nth-child(even) {
            background: #1778ff;
        }

        .rank-num {
            font-size: 36px;
            font-weight: 800;
            text-align: center;
            font-family: 'Agency FB', 'Oswald', sans-serif;
        }

        .team-info {
            display: flex;
            align-items: center;
            gap: 12px;
            overflow: hidden;
        }

        .team-logo {
            width: 42px;
            height: 42px;
            object-fit: contain;
        }

        .team-name {
            font-size: 26px;
            font-weight: 800;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: 'Agency FB', 'Oswald', sans-serif;
        }

        .stat-val {
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            font-family: 'Agency FB', 'Oswald', sans-serif;
        }

        .total-pts {
            font-size: 36px;
            color: #ffffff;
            font-weight: 800;
            text-align: center;
            font-family: 'Agency FB', 'Oswald', sans-serif;
        }

        /* BOTTOM SPONSOR & SOCIAL BAR */
        .bottom-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 1920px;
            height: 90px;
            background: #0fa2e6;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            color: #ffffff;
        }

        .presents-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            font-family: 'Agency FB', 'Oswald', sans-serif;
        }

        .social-handles {
            display: flex;
            align-items: center;
            gap: 60px;
        }

        .social-box {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .social-icon {
            width: 45px;
            height: 45px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .social-icon img {
            width: 26px;
            height: 26px;
        }

        .social-details {
            display: flex;
            flex-direction: column;
        }

        .social-label {
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-transform: none;
            opacity: 0.9;
        }

        .social-val {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .org-branding {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .org-logo-img {
            height: 55px;
            object-fit: contain;
        }

        .org-name {
            font-size: 28px;
            font-weight: 800;
            font-family: 'Agency FB', 'Oswald', sans-serif;
        }
    </style>
</head>
<body>

    <!-- SIDEBAR BRANDING LOGOS -->
    <div class="left-sidebar">
        <img src="https://i.ibb.co/6y4G8sV/bgmi-logo.png" class="bgmi-top-logo" alt="BGMI" onerror="this.style.display='none'">
        <img src="https://i.ibb.co/3kC0b8g/pan.png" class="pan-icon" alt="Pan" onerror="this.style.display='none'">
        <img id="view-tourneyLogo" src="" class="tourney-main-logo" alt="Tournament Logo">
        <img src="https://i.ibb.co/3kC0b8g/pan.png" class="pan-icon" alt="Pan" onerror="this.style.display='none'">
    </div>

    <!-- TOP TITLE HEADER -->
    <div class="header-accent-1"></div>
    <div class="header-accent-2"></div>
    <div class="header-banner">
        <div id="view-title" class="header-title">MATCH RANKINGS</div>
    </div>

    <!-- 18 TEAMS BOARD GRID -->
    <div class="board-container">
        <!-- COLUMN 1 HEADERS -->
        <div class="row-headers" style="left:0;">
            <span>RANK</span><span>TEAM</span><span style="text-align:center;">PLACE PTS</span><span style="text-align:center;">KILLS</span><span style="text-align:center;">TOTAL</span>
        </div>
        <!-- COLUMN 2 HEADERS -->
        <div class="row-headers" style="left: 737px;">
            <span>RANK</span><span>TEAM</span><span style="text-align:center;">PLACE PTS</span><span style="text-align:center;">KILLS</span><span style="text-align:center;">TOTAL</span>
        </div>

        <!-- 18 DYNAMIC TEAM SLOTS -->
        <div id="grid-left" style="display:flex; flex-direction:column; gap:12px;"></div>
        <div id="grid-right" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>

    <!-- BOTTOM BRANDING FOOTER BAR -->
    <div class="bottom-bar">
        <div id="view-presentedBy" class="presents-text">DIVINE OMEN PRESENTS</div>

        <div class="social-handles">
            <div class="social-box">
                <div class="social-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174855.png" alt="Insta">
                </div>
                <div class="social-details">
                    <span class="social-label">Follow us on Instagram :</span>
                    <span id="view-insta" class="social-val">@DIVINE_OMEN</span>
                </div>
            </div>

            <div class="social-box">
                <div class="social-icon">
                    <img src="https://cdn-icons-png.flaticon.com/512/1384/1384060.png" alt="YT">
                </div>
                <div class="social-details">
                    <span class="social-label">Catch the live on YouTube :</span>
                    <span id="view-yt" class="social-val">GODS OMEN</span>
                </div>
            </div>
        </div>

        <div class="org-branding">
            <img id="view-orgLogo" src="" class="org-logo-img" alt="" onerror="this.style.display='none'">
            <span id="view-orgName" class="org-name">DIVINE OMEN</span>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const SYNC_PATH = 'TournamentData/LiveSession';

        db.ref(SYNC_PATH).on('value', (snap) => {
            const data = snap.val() || {};
            const info = data.info || {};
            const teams = data.teams || [];
            const history = data.history || {};
            const activeView = data.activeView || 'OVERALL';

            // 1. Update Tournament & Social Info
            document.getElementById('view-presentedBy').innerText = info.presentedBy ? `${info.presentedBy} PRESENTS` : 'PRESENTS';
            document.getElementById('view-insta').innerText = info.instaHandle || '@instagram';
            document.getElementById('view-yt').innerText = info.ytHandle || 'YouTube Stream';
            document.getElementById('view-tourneyLogo').src = info.tourneyLogo || 'https://i.ibb.co/3f5N73g/default-logo.png';
            document.getElementById('view-orgLogo').src = info.orgLogo || '';
            document.getElementById('view-orgName').innerText = info.presentedBy || '';

            // 2. Determine View (Match Specific vs Overall)
            let displayTeams = [];
            if(activeView === 'OVERALL') {
                document.getElementById('view-title').innerText = info.tourneyName ? `${info.tourneyName} - OVERALL` : "OVERALL STANDINGS";
                displayTeams = [...teams].map(t => ({
                    name: t.name,
                    logo: t.logo,
                    pos: (parseInt(t.prevPos)||0) + (parseInt(t.pos)||0),
                    fin: (parseInt(t.prevFin)||0) + (parseInt(t.fin)||0),
                    total: ((parseInt(t.prevPos)||0) + (parseInt(t.pos)||0)) + ((parseInt(t.prevFin)||0) + (parseInt(t.fin)||0))
                }));
            } else {
                document.getElementById('view-title').innerText = `${activeView.replace("Match", "MATCH ")} RANKINGS`;
                const savedMatch = history[activeView] || [];
                displayTeams = [...savedMatch].map(t => ({
                    name: t.name,
                    logo: t.logo,
                    pos: parseInt(t.pos)||0,
                    fin: parseInt(t.fin)||0,
                    total: (parseInt(t.pos)||0) + (parseInt(t.fin)||0)
                }));
            }

            // Sort by Total Points descending
            displayTeams.sort((a,b) => b.total - a.total);

            // Pad up to 18 Teams
            while(displayTeams.length < 18) {
                displayTeams.push({ name: '-', logo: '', pos: 0, fin: 0, total: 0 });
            }

            // 3. Render 1 to 9 (Left Column) & 10 to 18 (Right Column)
            renderColumn('grid-left', displayTeams.slice(0, 9), 1);
            renderColumn('grid-right', displayTeams.slice(9, 18), 10);
        });

        function renderColumn(elementId, teamList, startRank) {
            const container = document.getElementById(elementId);
            container.innerHTML = '';

            teamList.forEach((t, i) => {
                const rankNum = startRank + i;
                const logoHtml = t.logo ? `<img src="${t.logo}" class="team-logo" onerror="this.style.display='none'">` : '';

                container.innerHTML += `
                    <div class="rank-card">
                        <div class="rank-num">${rankNum}</div>
                        <div class="team-info">
                            ${logoHtml}
                            <span class="team-name">${t.name}</span>
                        </div>
                        <div class="stat-val">${t.pos}</div>
                        <div class="stat-val">${t.fin}</div>
                        <div class="total-pts">${t.total}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
