<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BGMI Live Stream Overlay Standings</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <style>
        :root {
            --cyan: #c000bb;
            --dark-blue: #d881cc;
            --row-bg: #e7a3dd;
            --text-color: #ffffff;
            --status-bg: #ffffff;
            --status-bar-color: #ffcc00;
            --top-row-bg: #d881cc;
            --rank-bg: #e7a3dd;
            --fin-bg: #e7a3dd;
            --total-bg: #190240;
            --elim-bg: #3a001e;
            --elim-popup-bg: #e63900;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Oswald', sans-serif; }
        body { background: transparent; overflow: hidden; width: 100vw; height: 100vh; display: flex; align-items: flex-start; justify-content: flex-start; padding: 10px; }

        /* Main Leaderboard Box */
        .board-container {
            width: 320px;
            background: var(--dark-blue);
            border: 3px solid var(--cyan);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            transition: all 0.3s ease;
        }

        .board-container.transparent-mode {
            background: transparent !important;
            border-color: transparent !important;
            box-shadow: none !important;
        }

        /* Header Row */
        .header-row {
            display: grid;
            grid-template-columns: 28px 32px 1fr 65px 35px 38px;
            background: var(--top-row-bg);
            color: var(--text-color);
            font-size: 11px;
            font-weight: 800;
            text-align: center;
            align-items: center;
            padding: 4px 2px;
            text-transform: uppercase;
            border-bottom: 2px solid var(--cyan);
        }

        /* Team Row */
        .team-row {
            display: grid;
            grid-template-columns: 28px 32px 1fr 65px 35px 38px;
            background: var(--row-bg);
            color: var(--text-color);
            align-items: center;
            margin-bottom: 2px;
            height: 32px;
            transition: background 0.3s;
        }

        .team-row.eliminated {
            background: var(--elim-bg) !important;
            opacity: 0.75;
        }

        .rank-col {
            background: var(--rank-bg);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
        }

        .logo-col {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 2px;
        }

        .logo-col img {
            width: 26px;
            height: 26px;
            object-fit: contain;
        }

        .name-col {
            font-weight: 700;
            font-size: 13px;
            padding-left: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-transform: uppercase;
        }

        /* Status Bars Container */
        .status-col {
            background: var(--status-bg);
            height: 20px;
            margin: 0 3px;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            padding: 0 2px;
        }

        .status-bar {
            width: 9px;
            height: 14px;
            background: var(--status-bar-color);
            border-radius: 1px;
            box-shadow: 0 0 4px var(--status-bar-color);
        }

        .status-bar.dead {
            background: rgba(0,0,0,0.2) !important;
            box-shadow: none !important;
        }

        .fin-col {
            background: var(--fin-bg);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 14px;
        }

        .total-col {
            background: var(--total-bg);
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 15px;
            color: var(--text-color);
        }

        /* Elimination Popup GFX Banner */
        .elim-popup {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--elim-popup-bg);
            color: #fff;
            padding: 10px 25px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            text-transform: uppercase;
        }

        .elim-popup.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="board-container" id="board">
        <div class="header-row">
            <div>#</div>
            <div>LOGO</div>
            <div style="text-align:left; padding-left:4px;">TEAM</div>
            <div>STATUS</div>
            <div>FIN.</div>
            <div>TOTAL</div>
        </div>
        <div id="team-rows"></div>
    </div>

    <!-- Elimination Popup Banner -->
    <div id="elim-banner" class="elim-popup">
        <img id="elim-logo" src="" style="width:35px; height:35px; object-fit:contain; display:none;">
        <div>
            <span id="elim-team-name" style="color: #ffeb3b;">TEAM</span> ELIMINATED!
            <div style="font-size: 12px; color: #ddd; font-weight: 500;">RANK: #<span id="elim-rank">0</span> | KILLS: <span id="elim-kills">0</span></div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const SYNC_PATH = 'TournamentData/LiveSession';

        let lastElimId = null;

        db.ref(SYNC_PATH).on('value', (snap) => {
            const data = snap.val() || {};
            const teams = data.teams || [];
            const config = data.config || {};
            const isTransparent = !!data.transparentLayout;
            const lastElim = data.lastEliminated || null;

            // Apply 12 Colors dynamically to CSS variables
            document.documentElement.style.setProperty('--cyan', config['cyan'] || '#c000bb');
            document.documentElement.style.setProperty('--dark-blue', config['dark-blue'] || '#d881cc');
            document.documentElement.style.setProperty('--row-bg', config['row-bg'] || '#e7a3dd');
            document.documentElement.style.setProperty('--text-color', config['text-color'] || '#ffffff');
            document.documentElement.style.setProperty('--status-bg', config['status-bg'] || '#ffffff');
            document.documentElement.style.setProperty('--status-bar-color', config['status-bar-color'] || '#ffcc00');
            document.documentElement.style.setProperty('--top-row-bg', config['top-row-bg'] || '#d881cc');
            document.documentElement.style.setProperty('--rank-bg', config['rank-bg'] || '#e7a3dd');
            document.documentElement.style.setProperty('--fin-bg', config['fin-bg'] || '#e7a3dd');
            document.documentElement.style.setProperty('--total-bg', config['total-bg'] || '#190240');
            document.documentElement.style.setProperty('--elim-bg', config['elim-bg'] || '#3a001e');
            document.documentElement.style.setProperty('--elim-popup-bg', config['elim-popup-bg'] || '#e63900');

            // Toggle Transparent GFX background
            const board = document.getElementById('board');
            if(isTransparent) {
                board.classList.add('transparent-mode');
            } else {
                board.classList.remove('transparent-mode');
            }

            renderOverlay(teams);

            // Handle Elimination Popup GFX
            if (lastElim && lastElim.id !== lastElimId) {
                lastElimId = lastElim.id;
                triggerElimBanner(lastElim);
            }
        });

        function renderOverlay(teams) {
            const container = document.getElementById('team-rows');
            container.innerHTML = '';

            // Calculate totals and sort ranking live
            let sorted = [...teams].map(t => {
                let currentFin = parseInt(t.fin) || 0;
                let prevFin = parseInt(t.prevFin) || 0;
                let currentPos = parseInt(t.pos) || 0;
                let prevPos = parseInt(t.prevPos) || 0;
                
                let totalFin = prevFin + currentFin;
                let grandTotal = totalFin + prevPos + currentPos;
                
                return { ...t, currentFin, totalFin, grandTotal };
            }).sort((a,b) => b.grandTotal - a.grandTotal);

            sorted.forEach((t, idx) => {
                let logoHtml = (t.logo && t.logo.trim() !== '') ? `<img src="${t.logo.trim()}" onerror="this.style.display='none'">` : '';
                let isElim = t.elim || t.alive.every(a => a == 0);

                let barsHtml = t.alive.map(a => `<div class="status-bar ${a ? '' : 'dead'}"></div>`).join('');

                container.innerHTML += `
                    <div class="team-row ${isElim ? 'eliminated' : ''}">
                        <div class="rank-col">${idx + 1}</div>
                        <div class="logo-col">${logoHtml}</div>
                        <div class="name-col">${t.name || 'TEAM'}</div>
                        <div class="status-col">${barsHtml}</div>
                        <div class="fin-col">${t.currentFin}</div>
                        <div class="total-col">${t.grandTotal}</div>
                    </div>
                `;
            });
        }

        function triggerElimBanner(elim) {
            const banner = document.getElementById('elim-banner');
            const name = document.getElementById('elim-team-name');
            const rank = document.getElementById('elim-rank');
            const kills = document.getElementById('elim-kills');
            const logo = document.getElementById('elim-logo');

            name.innerText = elim.name || 'TEAM';
            rank.innerText = elim.rank || '0';
            kills.innerText = elim.finishes || '0';

            if(elim.logo && elim.logo.trim() !== '') {
                logo.src = elim.logo.trim();
                logo.style.display = 'block';
            } else {
                logo.style.display = 'none';
            }

            banner.classList.add('show');
            setTimeout(() => {
                banner.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
