<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BGMI Live Stream Overlay View Panel</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        @font-face {
            font-family: 'Agency FB';
            src: local('Agency FB Bold'), local('AgencyFB-Bold'), local('Agency FB');
            font-weight: bold;
        }

        :root {
            --cyan: #ffcc00;
            --dark-blue: #12193b;
            --row-bg: #1a2245;
            --top-row-bg: #15191d;
            --status-bar-color: #ffcc00;
            --pred-tag-bg: #ffb800;
            --elim-main-bg: #e63900;
            --elim-stats-bg: #ffaa00;
        }

        * { box-sizing: border-box; }
        body { margin: 0; padding: 20px; font-family: 'Agency FB', 'Oswald', sans-serif; background: transparent; overflow: hidden; }

        .board-container {
            width: 450px;
            background: var(--dark-blue);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            transition: background 0.3s ease;
        }
        .board-container.transparent-mode {
            background: transparent !important;
            box-shadow: none !important;
        }

        .header-bar {
            background: var(--top-row-bg);
            padding: 12px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: #fff;
            border-bottom: 2px solid var(--cyan);
        }
        .header-title { font-size: 22px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }

        .team-list-overlay { display: flex; flex-direction: column; gap: 4px; padding: 6px; }

        .overlay-row {
            display: flex;
            align-items: center;
            background: var(--row-bg);
            height: 38px;
            border-radius: 4px;
            overflow: hidden;
            position: relative;
            animation: fadeIn 0.4s ease-in-out;
        }
        .overlay-row.eliminated { opacity: 0.45; filter: grayscale(80%); }

        .rank-box { width: 38px; height: 100%; background: rgba(0,0,0,0.3); color: var(--cyan); display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: bold; }
        .logo-box { width: 36px; height: 36px; padding: 2px; display: flex; align-items: center; justify-content: center; }
        .logo-box img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .name-box { flex: 1; padding-left: 8px; font-size: 20px; color: #fff; font-weight: bold; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .status-dots { display: flex; gap: 3px; margin-right: 10px; }
        .dot { width: 10px; height: 10px; border-radius: 2px; background: #333; }
        .dot.alive { background: var(--status-bar-color); }

        .pts-box { width: 48px; height: 100%; background: var(--cyan); color: #000; font-size: 22px; font-weight: bold; display: flex; align-items: center; justify-content: center; }

        /* PURANE ELIMINATION BANNER ANIMATIONS */
        .elim-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--elim-main-bg);
            color: #fff;
            padding: 12px 20px;
            border-radius: 6px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 0 15px rgba(230, 57, 0, 0.8);
            animation: slideInRight 0.5s ease, fadeOut 0.5s ease 4.5s forwards;
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 999;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideInRight { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
    </style>
</head>
<body>
    <div id="toast-container"></div>
    <div id="board" class="board-container">
        <div class="header-bar">
            <div id="tourney-title" class="header-title">LIVE MATCH STANDINGS</div>
        </div>
        <div id="overlay-teams" class="team-list-overlay"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://bgmi-overlay-default-rtdb.firebaseio.com" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const SYNC_PATH = 'TournamentData/LiveSession';

        let lastElimId = null;

        db.ref(SYNC_PATH).on('value', (snap) => {
            const data = snap.val() || {};
            const teams = data.teams || [];
            const isTransparent = !!data.transparentLayout;
            const config = data.config || {};
            const info = data.info || {};

            // Apply Dynamic Root CSS Colors
            if(config.cyan) document.documentElement.style.setProperty('--cyan', config.cyan);
            if(config['dark-blue']) document.documentElement.style.setProperty('--dark-blue', config['dark-blue']);
            if(config['row-bg']) document.documentElement.style.setProperty('--row-bg', config['row-bg']);
            if(config['top-row-bg']) document.documentElement.style.setProperty('--top-row-bg', config['top-row-bg']);
            if(config['status-bar-color']) document.documentElement.style.setProperty('--status-bar-color', config['status-bar-color']);
            if(config['elim-main-bg']) document.documentElement.style.setProperty('--elim-main-bg', config['elim-main-bg']);

            const board = document.getElementById('board');
            if(isTransparent) board.classList.add('transparent-mode');
            else board.classList.remove('transparent-mode');

            if(info.tourneyName) {
                document.getElementById('tourney-title').innerText = info.tourneyName;
            }

            renderOverlay(teams);

            if(data.lastEliminated && data.lastEliminated.id !== lastElimId) {
                lastElimId = data.lastEliminated.id;
                showEliminationToast(data.lastEliminated);
            }
        });

        function renderOverlay(teams) {
            const container = document.getElementById('overlay-teams');
            container.innerHTML = '';

            let sorted = [...teams].sort((a,b) => {
                let totA = (parseInt(a.fin)||0) + (parseInt(a.pos)||0);
                let totB = (parseInt(b.fin)||0) + (parseInt(b.pos)||0);
                return totB - totA;
            });

            sorted.forEach((t, i) => {
                let totalPts = (parseInt(t.fin)||0) + (parseInt(t.pos)||0);
                let isElim = t.elim || t.alive.every(a => a == 0);

                container.innerHTML += `
                    <div class="overlay-row ${isElim ? 'eliminated' : ''}">
                        <div class="rank-box">#${i+1}</div>
                        <div class="logo-box">
                            ${t.logo ? `<img src="${t.logo}" onerror="this.style.display='none'">` : ''}
                        </div>
                        <div class="name-box">${t.name || 'TEAM'}</div>
                        <div class="status-dots">
                            ${t.alive.map(a => `<div class="dot ${a ? 'alive' : ''}"></div>`).join('')}
                        </div>
                        <div class="pts-box">${totalPts}</div>
                    </div>
                `;
            });
        }

        function showEliminationToast(elim) {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'elim-toast';
            toast.innerHTML = `
                <span>ELIMINATED #${elim.rank}</span> | 
                <span>${elim.name}</span> | 
                <span>KILLS: ${elim.finishes}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }
    </script>
</body>
</html>
